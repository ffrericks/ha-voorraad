                `${p.begin && p.begin !== p.hoeveelheid ? ' · was ' + esc(p.begin) : ''}${p.opmerking ? ' · ' + esc(p.opmerking) : ''}</div>
                <div class="vz-b"><button class="pri" data-vz="all-out" data-code="${c}">Helemaal eruit</button>
                  <button data-vz="reprint" data-code="${c}">Label printen</button><button data-vz="edit" data-code="${c}">Wijzigen</button>
                  <button data-vz="open" data-code="${c}">Inklappen</button></div>` +
                (p.getal != null ? `<div class="vz-part"><input class="vz-amount" placeholder="bv. 200 g" autocomplete="off">` +
                  `<button data-vz="part" data-code="${c}">Haal eruit</button><button data-vz="rest" data-code="${c}">Blijft over</button></div>`
                  : '<div class="vz-s" style="margin-top:6px">Geen hoeveelheid bekend; vul die in bij Wijzigen om een deel eruit te halen.</div>') + `
                <div class="ed">
                  <label>Naam</label><input name="naam" value="${esc(p.naam)}" autocomplete="off">
                  <div class="vz-row"><div><label>Hoeveelheid nu</label><input name="hoeveelheid" value="${esc(p.hoeveelheid)}" placeholder="bv. 300 g" autocomplete="off"></div>
                    <div><label>Opmerking</label><input name="opmerking" value="${esc(p.opmerking)}" autocomplete="off"></div></div>
                  <div class="vz-row"><div><label>Ingevroren op</label><input name="ingevroren" type="date" value="${esc(p.ingevroren)}"></div>
                    <div><label>Op voor</label><input name="op_voor" type="date" value="${esc(p.op_voor)}"></div></div>
                  <div class="vz-b"><button class="pri" data-vz="save-edit" data-code="${c}">Opslaan</button><button data-vz="wipe" data-code="${c}">Wissen (vergissing)</button></div>
                </div>
              </div></div>`;
          }
          if (at.recent_uit && at.recent_uit.length) {
            out += `<details><summary>Laatst uitgehaald (${at.recent_uit.length})</summary>` + at.recent_uit.map((p) =>
              `<div class="vz-q"><code>${esc(p.code)}</code><span class="n">${esc(p.naam)} <span class="vz-s">${vz.nl(p.uit.slice(0, 10))}</span></span>` +
              `<button data-vz="undo" data-code="${esc(p.code)}">Terugzetten</button></div>`).join('') + '</details>';
          }
          if (at.bonprinter) out += '<div class="vz-b" style="margin-top:14px"><button data-vz="bon">Overzicht op bon printen</button></div>';
          return "<style>\n  .vz{text-align:left;font-size:14px;line-height:1.4;white-space:normal}\n  .vz button{font:inherit;font-size:13px;border:1px solid var(--divider-color);background:var(--card-background-color);\n    color:var(--primary-text-color);border-radius:8px;padding:6px 11px;cursor:pointer}\n  .vz button.pri{background:var(--primary-color);border-color:var(--primary-color);color:#fff}\n  .vz button.arm{background:var(--error-color,#c62828);border-color:var(--error-color,#c62828);color:#fff}\n  .vz button[disabled]{opacity:.6}\n  .vz label{display:block;font-size:12px;color:var(--secondary-text-color);margin:8px 0 2px}\n  .vz input,.vz select{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:8px;\n    border:1px solid var(--divider-color);border-radius:8px;background:var(--card-background-color);color:var(--primary-text-color)}\n  .vz input[type=date]{cursor:pointer}\n  .vz-row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}\n  .vz-b{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}\n  .vz-status{margin-top:8px;font-size:13px;min-height:1em}\n  .vz-status:empty{display:none}\n  .vz-status.err{color:var(--error-color,#c62828)}\n  .vz-status.ok{color:var(--success-color,#2e7d32)}\n  .vz-s{color:var(--secondary-text-color);font-size:13px}\n  .vz-empty{color:var(--secondary-text-color);font-size:13px}\n  .vz-h{font-weight:600;font-size:15px;margin:14px 0 4px}\n  .vz-h:first-child{margin-top:0}\n  .vz-h span{font-weight:400;color:var(--secondary-text-color);font-size:13px}\n  table.vz-t{width:100%;border-collapse:collapse;font-size:13px}\n  .vz-t td{padding:4px 6px 4px 0;border-top:1px solid var(--divider-color);vertical-align:top}\n  .vz-t td.n{font-weight:500}\n  .vz-t td.o{color:var(--secondary-text-color);white-space:nowrap}\n  .late{color:var(--error-color,#c62828) !important}\n  .vz-q{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--divider-color)}\n  .vz-q .n{flex:1}\n  .vz-q code,.vz-pk code{font-size:12px;background:var(--secondary-background-color,#f1f1f1);border-radius:6px;padding:1px 6px}\n  .vz-pk{border-top:1px solid var(--divider-color)}\n  .vz-pk .top{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}\n  .vz-pk .top .n{flex:1}\n  .vz-pk .top .q{color:var(--secondary-text-color);white-space:nowrap}\n  .vz-pk .more,.vz-pk .ed{display:none;padding:2px 0 12px}\n  .vz-pk.open .more{display:block}\n  .vz-pk.open.editing .ed{display:block}\n  .vz-pk.open{background:var(--secondary-background-color,#f6f6f6);margin:0 -10px;padding:0 10px;border-radius:10px}\n  .vz-part{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}\n  .vz-part input{flex:1;min-width:90px;width:auto}\n  .vz-badge{font-size:11px;border-radius:8px;padding:1px 7px;background:#fff3cd;color:#7a5b00;margin-left:4px;white-space:nowrap}\n  .vz details summary{cursor:pointer;color:var(--secondary-text-color);margin-top:14px}\n</style>" + `<div class="vz">${vz.msgHtml('list')}${out}</div>`;
          ]]]
      styles:
        card:
        - padding: 12px 16px 14px
        - pointer-events: auto
        - cursor: default
        grid:
        - grid-template-areas: '"voorraad"'
        - grid-template-columns: 1fr
        custom_fields:
          voorraad:
          - width: 100%
      grid_options:
        columns: full
        rows: auto
