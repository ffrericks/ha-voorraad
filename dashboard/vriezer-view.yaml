          out += '<div class="vz-h" style="margin-top:18px">Pakjes <span>tik om eruit te halen</span></div>';
          const sorted = [...at.pakjes].sort((a, b) => a.op_voor.localeCompare(b.op_voor) || a.naam.localeCompare(b.naam, 'nl'));
          if (!sorted.length) out += '<div class="vz-empty">De vriezer is leeg.</div>';
          for (const p of sorted) {
            const late = p.op_voor < today;
            const c = esc(p.code);
            out += `<div class="vz-pk${vz.open === p.code ? ' open' : ''}${vz.open === p.code && vz.edit === p.code ? ' editing' : ''}" data-code="${c}">
              <div class="top" data-vz="open" data-code="${c}"><code>${c}</code><span class="n">${esc(p.naam)}${p.geprint ? '' : '<span class="vz-badge">label nog printen</span>'}</span>
